# TableRL en nginx: sirve la app bajo el prefijo /herramientas/tablerl/
# (el túnel de Cloudflare reenvía la ruta completa, sin recortarla).
server {
    listen 80;
    server_name _;

    # Sin la barra final, nginx no entra al location de arriba: redirigir.
    # https explícito: detrás del túnel el origen solo ve http y $scheme
    # mentiría; $host conserva reoxlab.com o www.reoxlab.com.
    location = /herramientas/tablerl {
        return 301 https://$host/herramientas/tablerl/;
    }

    location /herramientas/tablerl/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /herramientas/tablerl/index.html;
    }

    # Fuera del prefijo no hay nada que servir.
    location / {
        return 404;
    }
}
