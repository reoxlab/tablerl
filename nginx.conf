# TableX en nginx: sirve la app bajo el prefijo /herramientas/tablex/
# (el túnel de Cloudflare reenvía la ruta completa, sin recortarla).
server {
    listen 80;
    server_name _;

    location /herramientas/tablex/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /herramientas/tablex/index.html;
    }

    # Fuera del prefijo no hay nada que servir.
    location / {
        return 404;
    }
}
